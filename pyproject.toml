[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-platform"
version = "1.0.0"
description = "Batch data platform (bronze/silver/gold on SQLite) for Olist e-commerce with a point-in-time late-delivery ML model, production simulation and drift monitoring."
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.6", "matplotlib>=3.8", "pyyaml>=6.0", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
olist = "olist_platform.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
